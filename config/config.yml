# MJQbe v2 — Configuration centrale
# Modifiable ici ou via le panel admin web (Settings > System)
# Les secrets (mots de passe, clés OAuth) restent dans .env — jamais ici.

server:
  web_port: 4443
  api_port: 4848
  api_host: "0.0.0.0"

  # Laisser vide pour accès par IP uniquement.
  # Exemple : "mjqbe.home" ou "mjqbe.example.com"
  # Un seul changement ici + dev up active le domaine partout (nginx + CORS).
  domain: ""

  https: false
  cert_path: "/etc/nginx/certs/cert.pem"
  cert_key_path: "/etc/nginx/certs/key.pem"

database:
  port: 5432
  pool_size: 5
  max_overflow: 10

auth:
  access_token_expire_minutes: 60
  refresh_token_expire_days: 30

logging:
  level: "info"
  access_log: true

features:
  app_launch_logging: true
  dev_mode: true
  dev_mode_local_only: true

native:
  ipc_socket: "/run/mjqbe/native.sock"
  daemon_socket: "/run/mjqbe/daemon.sock"

system:
  stats_poll_interval: 2
  max_processes_displayed: 50
