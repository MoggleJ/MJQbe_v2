name: API CI

on:
  push:
    branches: [dev, main, "sprint-*"]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "api/**"

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mjqbe
          POSTGRES_PASSWORD: mjqbe_ci
          POSTGRES_DB: mjqbe_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Install lint tools
        run: pip install flake8

      - name: Lint
        run: flake8 api/app --max-line-length=100 --extend-ignore=E203,W503

      - name: Tests
        env:
          DATABASE_URL: postgresql://mjqbe:mjqbe_ci@localhost:5432/mjqbe_test
          SECRET_KEY: ci-secret-key-not-for-production
          POSTGRES_USER: mjqbe
          POSTGRES_PASSWORD: mjqbe_ci
          POSTGRES_DB: mjqbe_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: |
          cd api
          pytest tests/ -v --tb=short

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build ./api -t mjqbe-api:ci --no-cache
