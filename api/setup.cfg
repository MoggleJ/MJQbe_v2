[flake8]
max-line-length = 120
# E203 / W503 : conflits connus avec black
# E221 / E241 : le code aligne volontairement les `=` et les valeurs (colonnes lisibles)
extend-ignore = E203,W503,E221,E241
exclude =
    .git,
    __pycache__,
    alembic/versions,
    .venv,
    venv

[tool:pytest]
pythonpath = .
testpaths = tests

