version: 2
ignore-paths:
  - .env.example
  - "**/*.example"
  - "docs/**"
  - "agents/**"
  - "tracking/**"          # journaux de dev — placeholders uniquement
  - "**/*.md"              # documentation — pas de secrets réels
  - "**/tests/**"          # fixtures de test (mots de passe factices bcrypt)
  - "native/core/tests/**"
  - "cli/**"               # script dev — uniquement des fallbacks .env, pas de secret
ignore-known-secrets: true

