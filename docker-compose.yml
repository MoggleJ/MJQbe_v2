services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mjqbe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mjqbe} -d ${POSTGRES_DB:-mjqbe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config/config.yml
    volumes:
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - daemon-socket:/run/mjqbe
    ports:
      - "4848:4848"
    networks:
      - mjqbe-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    volumes:
      - ./config:/app/config:ro
    networks:
      - mjqbe-network
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:4443:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3

  daemon:
    build:
      context: ./daemon
    restart: unless-stopped
    privileged: true
    volumes:
      - daemon-socket:/run/mjqbe
      - ./config:/app/config:ro
    networks:
      - mjqbe-network

networks:
  mjqbe-network:
    driver: bridge

volumes:
  db-data:
  daemon-socket:
