# Override développement — hot-reload frontend et API
# Usage : dev watch

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "0.0.0.0:4444:5173"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      VITE_API_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  api:
    volumes:
      - ./api:/app
      - ./config:/app/config
      - daemon-socket:/run/mjqbe
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "4848", "--reload"]
